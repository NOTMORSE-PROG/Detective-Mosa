name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: 4.7.1-stable
  GODOT_DOWNLOAD_URL: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: always()

      - name: Install Godot (headless — plain binary, no graphical wrapper)
        if: always()
        # Not using lihop/setup-godot here: it symlinks `godot` to a wrapper script meant
        # for graphical/X11 testing, which fails with "Exec format error" in a headless-only
        # job like this one. A direct download of the official binary sidesteps it entirely.
        run: |
          curl -sL "$GODOT_DOWNLOAD_URL" -o godot.zip
          unzip -q godot.zip
          sudo mv Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Headless import warm-up
        if: always()
        run: godot --headless --path . --import --quit

      - name: Install gdtoolkit
        if: always()
        run: pip install gdtoolkit==4.5.0

      - name: gdformat --check
        if: always()
        run: python3 tools/check_quality.py format-lint

      - name: Script parse (--check-only)
        if: always()
        run: python3 tools/check_quality.py parse

      - name: Trace guard
        if: always()
        run: python3 tools/check_quality.py trace

      - name: Token guard
        if: always()
        run: python3 tools/check_quality.py token

      - name: Trust guard
        if: always()
        run: python3 tools/check_quality.py trust

      - name: Audio guard
        if: always()
        run: python3 tools/check_quality.py audio

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: always()

      - name: Install Godot (headless — plain binary, no graphical wrapper)
        if: always()
        run: |
          curl -sL "$GODOT_DOWNLOAD_URL" -o godot.zip
          unzip -q godot.zip
          sudo mv Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Headless import warm-up
        if: always()
        run: godot --headless --path . --import --quit

      - name: GUT tests
        if: always()
        env:
          GODOT_DISABLE_LEAK_CHECKS: "1"
        run: python3 tools/check_quality.py gut

  build:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7.1
    needs: [quality, test]
    env:
      # barichello/godot-ci bakes export templates, the debug keystore, and Android/Java
      # SDK paths into /root/... at image-build time. GitHub Actions' `container:` jobs
      # remap $HOME to /github/home regardless, which points Godot at an empty directory
      # and makes it report "no export template found" as if DM-001 never ran. Restoring
      # HOME to where the image actually put everything fixes it without touching the image.
      HOME: /root
    steps:
      - uses: actions/checkout@v4
        if: always()

      - name: Materialize export preset (debug-only, no secrets)
        if: always()
        # export_presets.cfg is gitignored (GIT.md §3) because a real one carries keystore
        # paths/passwords. This build is debug-only, and Godot has auto-generated the debug
        # keystore since 4.3 — so the committed .example.cfg (DM-003) is safe to use as-is.
        run: cp export_presets.example.cfg export_presets.cfg

      - name: Headless import warm-up
        if: always()
        run: godot --headless --path . --import --quit

      - name: Export Android debug APK
        if: always()
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android Debug" build/android/detective-mosa-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detective-mosa-debug-apk
          path: build/android/*.apk
